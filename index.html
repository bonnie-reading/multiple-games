<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
  <title>寶貝球排球：神廚九九乘法特訓</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; padding: 10px 0;
      background: #74b9ff;
      display: flex; flex-direction: column; align-items: center;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }
    .hud {
      display: flex; gap: 10px; align-items: center; justify-content: space-between;
      background: #fff; padding: 6px 16px; border-radius: 30px;
      margin-bottom: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      flex-wrap: wrap; width: 95vw; max-width: 860px;
    }
    .hud-left { display: flex; gap: 8px; align-items: center; }
    .btn-top {
      background: #0984e3; color: #fff; border: none; padding: 6px 12px;
      border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 13px;
    }
    .btn-top.sound-off { background: #778ca3; }
    .question-box {
      font-size: 26px; font-weight: 900; color: #d63031;
      background: #ffeaa7; padding: 4px 18px; border-radius: 20px;
      border: 3px dashed #e17055;
    }
    .status-text { font-size: 15px; font-weight: bold; color: #2d3436; }
    #gameWrapper {
      position: relative;
      width: 95vw; max-width: 860px;
    }
    canvas {
      background: linear-gradient(to bottom, #ffeaa7 0%, #ffbe76 100%);
      border: 5px solid #fdcb6e; border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      display: block; width: 100%; height: auto;
    }

    /* 懸浮遮罩面板 (主設定與結算) */
    .overlay-modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); border-radius: 20px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      backdrop-filter: blur(5px); z-index: 100;
    }
    .card-box {
      background: #ffffff; padding: 16px 20px; border-radius: 24px;
      text-align: center; border: 5px solid #ffbe76;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35); width: 92%; max-width: 530px;
      animation: pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes pop {
      0% { transform: scale(0.65); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .card-title { font-size: 22px; font-weight: 900; color: #2d3436; margin: 0 0 8px 0; }
    .setting-row { margin-bottom: 8px; text-align: left; }
    .setting-label { font-size: 13px; font-weight: bold; color: #636e72; margin-bottom: 3px; display: block; }
    .opt-group { display: flex; gap: 6px; }
    .opt-btn {
      flex: 1; padding: 6px 3px; border: 2px solid #dfe6e9; background: #f8f9fa;
      border-radius: 12px; font-size: 12px; font-weight: bold; color: #2d3436;
      cursor: pointer; line-height: 1.3;
    }
    .opt-btn.active {
      border-color: #e17055; background: #ffeaa7; color: #d63031;
      transform: scale(1.02); box-shadow: 0 3px 6px rgba(225, 112, 85, 0.25);
    }
    .btn-main-action {
      width: 100%; margin-top: 8px; padding: 11px; font-size: 18px; font-weight: 900;
      color: #fff; background: #10ac84; border: none; border-radius: 30px;
      cursor: pointer; box-shadow: 0 5px 15px rgba(16, 172, 132, 0.4);
    }
    .btn-main-action:active { transform: scale(0.97); }

    /* 頒獎典禮元件 */
    .medal-icon { font-size: 60px; margin-bottom: 2px; }
    .award-text { font-size: 16px; font-weight: bold; color: #636e72; margin: 6px 0; }

    /* 觸控控制列 */
    .controls-row {
      display: flex; justify-content: space-between; align-items: center;
      width: 95vw; max-width: 860px; margin-top: 10px; padding: 0 10px;
    }
    .d-pad { display: flex; gap: 12px; }
    .ctrl-btn {
      width: 70px; height: 70px; border-radius: 50%; border: none;
      background: #fff; font-size: 26px; font-weight: bold; color: #2d3436;
      box-shadow: 0 5px 12px rgba(0,0,0,0.2); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .ctrl-btn:active { transform: translateY(3px); background: #dfe6e9; }
    .btn-jump {
      width: 80px; height: 80px; background: #ff7675; color: #fff;
      font-size: 20px; font-weight: 900;
    }
    .btn-jump:active { background: #d63031; }
  </style>
</head>
<body>

  <div class="hud">
    <div class="hud-left">
      <button class="btn-top" id="btnOpenMenu">⚙️ 設定選單</button>
      <button class="btn-top" id="btnAudioToggle">🔊 音效：開</button>
    </div>
    <div class="status-text" id="timerLabel">⏳ 倒數: 120s</div>
    <div class="question-box" id="questionLabel">請先確認設定</div>
    <div class="status-text" id="scoreLabel">⭐ 得分: 0</div>
    <div class="status-text" id="streakLabel">🔥 連擊: 0</div>
  </div>

  <div id="gameWrapper">
    <canvas id="gameCanvas" width="860" height="460"></canvas>

    <!-- 1. 開局前設定選單 -->
    <div class="overlay-modal" id="menuModal">
      <div class="card-box">
        <h2 class="card-title">🔴 寶貝球排球：挑戰設定</h2>
        
        <!-- 時限 -->
        <div class="setting-row">
          <span class="setting-label">⏱️ 選擇時限：</span>
          <div class="opt-group" id="grpTime">
            <button class="opt-btn" data-val="60">⚡ 1 分鐘<br>(熱身)</button>
            <button class="opt-btn active" data-val="120">⏳ 2 分鐘<br>(標準)</button>
            <button class="opt-btn" data-val="180">🏆 3 分鐘<br>(耐力)</button>
          </div>
        </div>

        <!-- 關卡難度 -->
        <div class="setting-row">
          <span class="setting-label">🎯 選擇關卡：</span>
          <div class="opt-group" id="grpDiff">
            <button class="opt-btn" data-val="easy">🌱 初階基礎<br>(2~5段)</button>
            <button class="opt-btn active" data-val="boss">🔥 大魔王特訓<br>(6~9段)</button>
            <button class="opt-btn" data-val="all">🌟 全段挑戰<br>(2~9段)</button>
          </div>
        </div>

        <!-- 速度 -->
        <div class="setting-row">
          <span class="setting-label">☁️ 料理速度：</span>
          <div class="opt-group" id="grpSpeed">
            <button class="opt-btn active" data-val="0.25">🎈 慢火烘焙<br>(0.25x 悠閒2秒發)</button>
            <button class="opt-btn" data-val="0.55">🍳 暖心料理<br>(0.55x)</button>
            <button class="opt-btn" data-val="0.85">🔥 快炒對決<br>(0.85x)</button>
            <button class="opt-btn" data-val="1.0" style="color:#d63031;">⚡ 終極快手<br>(1.0x)</button>
          </div>
        </div>

        <!-- 音效開關 -->
        <div class="setting-row">
          <span class="setting-label">🔊 音效開關：</span>
          <div class="opt-group" id="grpSound">
            <button class="opt-btn active" data-val="on">🔊 開啟音效</button>
            <button class="opt-btn" data-val="off">🔇 靜音模式</button>
          </div>
        </div>

        <button class="btn-main-action" id="btnStartGame">🚀 開始挑戰出餐！</button>
      </div>
    </div>

    <!-- 2. 結算頒獎畫面 -->
    <div class="overlay-modal" id="awardModal" style="display: none;">
      <div class="card-box">
        <div class="medal-icon" id="awardMedal">🥇</div>
        <h2 class="card-title" id="awardTitle">大師球特級神廚金牌！</h2>
        <div class="award-text" id="awardScore">總得分: 100 分</div>
        <div class="award-text" id="awardDetails">答對: 10 題 ｜ 最高連擊: 5 次</div>
        <button class="btn-main-action" id="btnReturnMenu">🔄 返回設定 / 再玩一局</button>
      </div>
    </div>
  </div>

  <div class="controls-row">
    <div class="d-pad">
      <button class="ctrl-btn" id="btnLeft">◀</button>
      <button class="ctrl-btn" id="btnRight">▶</button>
    </div>
    <button class="ctrl-btn btn-jump" id="btnJump">跳躍 ⬆</button>
  </div>

<script>
// ==================== 音效引擎 ====================
let audioEnabled = true;
let audioCtx = null;

function safeTone(freq, type = 'sine', duration = 0.15) {
  if (!audioEnabled) return;
  try {
    if (!audioCtx) {
      const AudioClass = window.AudioContext || window.webkitAudioContext;
      if (AudioClass) audioCtx = new AudioClass();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    if (!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const now = audioCtx.currentTime;
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  } catch(e) {}
}

const Sound = {
  jump: () => safeTone(450, 'sine', 0.12),
  serve: () => safeTone(520, 'triangle', 0.15),
  correct: () => {
    safeTone(523, 'sine', 0.1);
    setTimeout(() => safeTone(659, 'sine', 0.1), 80);
    setTimeout(() => safeTone(784, 'sine', 0.2), 160);
  },
  wrong: () => safeTone(150, 'sawtooth', 0.22),
  fanfare: () => {
    safeTone(523, 'triangle', 0.15);
    setTimeout(() => safeTone(659, 'triangle', 0.15), 140);
    setTimeout(() => safeTone(784, 'triangle', 0.2), 280);
    setTimeout(() => safeTone(1046, 'triangle', 0.45), 440);
  }
};

// ==================== 遊戲狀態與參數 ====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const GROUND_Y = 405;

let configDuration = 120;
let configDiff = 'boss';
let configSpeed = 0.25;

let isPlaying = false;
let score = 0;
let streak = 0;
let maxStreak = 0;
let correctCount = 0;
let timeLeft = 120;
let gameTimer = null;

let currentA = 7, currentB = 8, rightAns = 56;
let balls = [];
let feedback = { text: "", color: "#27ae60", timer: 0 };

// ★ 落地學習複習暫停狀態
let reviewPause = { active: false, remainingFrames: 0, textFormula: "" };

const keys = { left: false, right: false, jump: false };

// ==================== 設定面板選項切換監聽 ====================
function setupOptionGroup(groupId, callback) {
  document.querySelectorAll(`#${groupId} .opt-btn`).forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll(`#${groupId} .opt-btn`).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      callback(btn.dataset.val);
    });
  });
}

setupOptionGroup('grpTime', val => configDuration = parseInt(val, 10));
setupOptionGroup('grpDiff', val => configDiff = val);
setupOptionGroup('grpSpeed', val => configSpeed = parseFloat(val));
setupOptionGroup('grpSound', val => {
  audioEnabled = (val === 'on');
  updateSoundUI();
});

function updateSoundUI() {
  const btn = document.getElementById('btnAudioToggle');
  if (audioEnabled) {
    btn.innerText = "🔊 音效：開";
    btn.className = "btn-top";
  } else {
    btn.innerText = "🔇 音效：關";
    btn.className = "btn-top sound-off";
  }
}
document.getElementById('btnAudioToggle').addEventListener('click', () => {
  audioEnabled = !audioEnabled;
  updateSoundUI();
  document.querySelectorAll('#grpSound .opt-btn').forEach(btn => {
    if ((btn.dataset.val === 'on' && audioEnabled) || (btn.dataset.val === 'off' && !audioEnabled)) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });
});

document.getElementById('btnStartGame').addEventListener('click', () => {
  document.getElementById('menuModal').style.display = 'none';
  document.getElementById('awardModal').style.display = 'none';
  startGame();
});

document.getElementById('btnOpenMenu').addEventListener('click', () => {
  pauseToMenu();
});

document.getElementById('btnReturnMenu').addEventListener('click', () => {
  document.getElementById('awardModal').style.display = 'none';
  document.getElementById('menuModal').style.display = 'flex';
  isPlaying = false;
  clearInterval(gameTimer);
});

function pauseToMenu() {
  isPlaying = false;
  clearInterval(gameTimer);
  document.getElementById('menuModal').style.display = 'flex';
}

function startGame() {
  score = 0;
  streak = 0;
  maxStreak = 0;
  correctCount = 0;
  timeLeft = configDuration;
  isPlaying = true;
  balls = [];
  reviewPause.active = false;

  document.getElementById('scoreLabel').innerText = `⭐ 得分: 0`;
  document.getElementById('streakLabel').innerText = `🔥 連擊: 0`;
  document.getElementById('timerLabel').innerText = `⏳ 倒數: ${timeLeft}s`;

  player.x = 240;
  player.y = GROUND_Y - player.radius;
  player.vy = 0;

  startClock();
  newRound();
}

function startClock() {
  clearInterval(gameTimer);
  gameTimer = setInterval(() => {
    // 當處於落地算式學習暫停時，倒數時間暫時凍結
    if (isPlaying && !reviewPause.active && timeLeft > 0) {
      timeLeft--;
      document.getElementById('timerLabel').innerText = `⏳ 倒數: ${timeLeft}s`;
      if (timeLeft <= 0) {
        showAward();
      }
    }
  }, 1000);
}

function showAward() {
  isPlaying = false;
  clearInterval(gameTimer);
  Sound.fanfare();

  const ratio = configDuration / 60;
  const gold = Math.round(80 * ratio);
  const silver = Math.round(50 * ratio);
  const bronze = Math.round(25 * ratio);

  let medal = "🥉";
  let title = "超級球美味銅牌！";
  if (score >= gold) {
    medal = "🥇";
    title = "大師球特級神廚金牌！";
  } else if (score >= silver) {
    medal = "🥈";
    title = "高級球星級主廚銀牌！";
  } else if (score >= bronze) {
    medal = "🥉";
    title = "超級球美味銅牌！";
  } else {
    medal = "🏅";
    title = "精靈球廚房見習徽章！";
  }

  document.getElementById('awardMedal').innerText = medal;
  document.getElementById('awardTitle').innerText = title;
  document.getElementById('awardScore').innerText = `總得分: ${score} 分`;
  document.getElementById('awardDetails').innerText = `答對題數: ${correctCount} 題 ｜ 最高連擊: ${maxStreak} 次`;
  document.getElementById('awardModal').style.display = 'flex';
}

// ==================== 角色與物體 ====================
const player = {
  x: 240, y: GROUND_Y - 32, vy: 0, radius: 32, grounded: true,
  update() {
    if (!isPlaying || reviewPause.active) return;
    if (keys.left) this.x -= 7.2;
    if (keys.right) this.x += 7.2;

    if (keys.jump && this.grounded) {
      this.vy = -9.6;
      this.grounded = false;
      Sound.jump();
    }

    this.vy += 0.38;
    this.y += this.vy;

    if (this.y >= GROUND_Y - this.radius) {
      this.y = GROUND_Y - this.radius;
      this.vy = 0;
      this.grounded = true;
    }

    if (this.x - this.radius < 20) this.x = 20 + this.radius;
    if (this.x + this.radius > 450) this.x = 450 - this.radius;
  },
  draw() {
    const cx = this.x, cy = this.y;
    ctx.save();
    // 耳朵
    ctx.fillStyle = '#f6b93b'; ctx.strokeStyle = '#2d3436'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(cx - 18, cy - 35, 8, 22, -0.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx + 18, cy - 35, 8, 22, 0.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // 耳尖
    ctx.fillStyle = '#2d3436';
    ctx.beginPath(); ctx.ellipse(cx - 24, cy - 50, 5, 8, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 24, cy - 50, 5, 8, 0.4, 0, Math.PI * 2); ctx.fill();
    // 身體與圍裙
    ctx.beginPath(); ctx.arc(cx, cy, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#f6b93b'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy + 8, this.radius * 0.72, 0, Math.PI);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    // 眼睛腮紅
    ctx.fillStyle = '#2d3436';
    ctx.beginPath(); ctx.arc(cx - 10, cy - 6, 5, 0, Math.PI * 2); ctx.arc(cx + 10, cy - 6, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff7675';
    ctx.beginPath(); ctx.arc(cx - 20, cy + 3, 6, 0, Math.PI * 2); ctx.arc(cx + 20, cy + 3, 6, 0, Math.PI * 2); ctx.fill();
    // 廚師帽
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#2d3436'; ctx.lineWidth = 2.5;
    ctx.fillRect(cx - 16, cy - this.radius - 12, 32, 14); ctx.strokeRect(cx - 16, cy - this.radius - 12, 32, 14);
    ctx.beginPath(); ctx.arc(cx, cy - this.radius - 18, 18, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
};

const enemy = {
  x: 710, y: GROUND_Y - 32, radius: 32,
  draw() {
    const cx = this.x, cy = this.y;
    ctx.save();
    ctx.fillStyle = '#cd84f1'; ctx.strokeStyle = '#2d3436'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(cx - 20, cy - 32, 9, 24, -0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx + 20, cy - 32, 9, 24, 0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#e056fd'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy + 8, this.radius * 0.72, 0, Math.PI);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.strokeStyle = '#2d3436'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx - 10, cy - 4, 5, Math.PI, 0); ctx.arc(cx + 10, cy - 4, 5, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = '#ff9ff3';
    ctx.beginPath(); ctx.arc(cx - 18, cy + 5, 6, 0, Math.PI * 2); ctx.arc(cx + 18, cy + 5, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#2d3436'; ctx.lineWidth = 2.5;
    ctx.fillRect(cx - 15, cy - this.radius - 10, 30, 12); ctx.strokeRect(cx - 15, cy - this.radius - 10, 30, 12);
    ctx.beginPath(); ctx.arc(cx, cy - this.radius - 16, 17, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
};

class PokeBall {
  constructor(targetX, value, isCorrect, delay) {
    this.x = 690;
    this.y = 230;
    this.targetX = targetX;
    this.value = value;
    this.isCorrect = isCorrect;
    this.radius = 33;
    this.delay = delay;
    this.vx = (targetX - 690) / 130;
    this.vy = -4.2;
    this.hit = false;
    this.fading = false;
    this.opacity = 1.0;
    this.landed = false;
    this.bounce = 0;
  }
  update() {
    if (!isPlaying || reviewPause.active) return;
    if (this.delay > 0) {
      this.delay--;
      if (this.delay === 10) Sound.serve();
      return;
    }
    if (this.fading) {
      this.opacity -= 0.12;
      this.y -= 0.5;
      if (this.opacity <= 0) this.landed = true;
      return;
    }
    if (this.hit) {
      this.x += 8; this.y -= 10;
      return;
    }

    const effectiveSpeed = configSpeed + Math.min(0.35, Math.floor(streak / 3) * 0.08);
    this.vy += 0.12 * effectiveSpeed;
    this.x += this.vx * effectiveSpeed;
    this.y += this.vy * effectiveSpeed;

    if (this.y + this.radius >= GROUND_Y) {
      this.y = GROUND_Y - this.radius;
      if (!this.isCorrect) {
        this.fading = true; // 錯解球觸地立刻消散
      } else {
        if (configSpeed <= 0.35 && this.bounce < 2) {
          this.bounce++;
          this.vy = -3.8;
          Sound.jump();
        } else {
          this.landed = true;
        }
      }
    }
  }
  draw() {
    if (this.delay > 0 || this.opacity <= 0) return;
    ctx.save();
    ctx.globalAlpha = this.opacity;

    if (!this.fading) {
      ctx.beginPath();
      ctx.ellipse(this.x, GROUND_Y, this.radius * 0.85, 7, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fill();
    }

    const cx = this.x, cy = this.y, r = this.radius;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI);
    ctx.fillStyle = '#f1f2f6'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, Math.PI * 2);
    ctx.fillStyle = '#eb4d4b'; ctx.fill();

    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = '#2d3436'; ctx.lineWidth = 3.5; ctx.stroke();
    ctx.fillStyle = '#2d3436'; ctx.fillRect(cx - r + 1, cy - 3.5, (r * 2) - 2, 7);

    ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI * 2);
    ctx.fillStyle = '#2d3436'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, 17, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff'; ctx.fill();

    ctx.fillStyle = '#2d3436';
    ctx.font = '900 23px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(this.value, cx, cy + 1.5);
    ctx.restore();
  }
}

// ==================== 發球與判定 ====================
function newRound() {
  if (!isPlaying) return;

  if (configDiff === 'easy') {
    const easy = [2, 3, 4, 5];
    currentA = easy[Math.floor(Math.random() * easy.length)];
  } else if (configDiff === 'boss') {
    const boss = [6, 7, 8, 9];
    currentA = boss[Math.floor(Math.random() * boss.length)];
  } else {
    currentA = Math.floor(Math.random() * 8) + 2;
  }
  currentB = Math.floor(Math.random() * 8) + 2;
  rightAns = currentA * currentB;

  document.getElementById('questionLabel').innerText = `${currentA} × ${currentB} = ?`;

  const options = [rightAns];
  while (options.length < 3) {
    const offset = (Math.floor(Math.random() * 4) + 1) * (Math.random() < 0.5 ? 1 : -1);
    const fake = Math.max(4, rightAns + offset);
    if (!options.includes(fake)) options.push(fake);
  }
  options.sort(() => Math.random() - 0.5);

  balls = [];
  const targetX = [175, 240, 305];
  targetX.sort(() => Math.random() - 0.5);

  const delayStep = (configSpeed <= 0.3) ? 120 : Math.round(Math.max(75, 28 / configSpeed));

  for (let i = 0; i < 3; i++) {
    balls.push(new PokeBall(targetX[i], options[i], options[i] === rightAns, i * delayStep));
  }
}

function checkHit() {
  if (!isPlaying || reviewPause.active) return;

  for (let b of balls) {
    if (b.delay > 0 || b.hit || b.fading || b.landed) continue;

    const dx = b.x - player.x;
    const dy = b.y - (player.y - 20);
    const dist = Math.hypot(dx, dy);

    if (dist < b.radius + 55) {
      b.hit = true;
      if (b.isCorrect) {
        score += 10;
        streak += 1;
        correctCount += 1;
        if (streak > maxStreak) maxStreak = streak;

        Sound.correct();
        feedback = { text: `🎉 正確！${currentA} × ${currentB} = ${rightAns}`, color: "#10ac84", timer: 70 };
        balls.forEach(other => { if (!other.isCorrect) other.fading = true; });
        setTimeout(newRound, 1500);
      } else {
        streak = 0;
        Sound.wrong();
        feedback = { text: `❌ 算錯囉，不是 ${b.value}`, color: "#ee5253", timer: 70 };
        setTimeout(newRound, 1500);
      }
      document.getElementById('scoreLabel').innerText = `⭐ 得分: ${score}`;
      document.getElementById('streakLabel').innerText = `🔥 連擊: ${streak}`;
      return;
    }
  }

  // ★ 核心改動：正解球落地時靜音，啟動「暫停 3 秒學習算式卡」
  const rightBall = balls.find(b => b.isCorrect);
  if (rightBall && rightBall.landed && !rightBall.hit) {
    streak = 0;
    document.getElementById('streakLabel').innerText = `🔥 連擊: 0`;

    // 啟動 3 秒 (以 60 FPS 計為 180 幀) 暫停複習
    reviewPause.active = true;
    reviewPause.remainingFrames = 180;
    reviewPause.textFormula = `${currentA} × ${currentB} = ${rightAns}`;

    // 清空球體，等待 3 秒結束後自動接續下一回合
    balls = [];
  }
}

// ==================== 按鍵與觸控監聽 ====================
window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') { keys.left = true; e.preventDefault(); }
  if (e.code === 'KeyD' || e.code === 'ArrowRight') { keys.right = true; e.preventDefault(); }
  if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') { keys.jump = true; e.preventDefault(); }
}, { passive: false });

window.addEventListener('keyup', (e) => {
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
  if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') keys.jump = false;
});

function bindBtn(id, prop) {
  const btn = document.getElementById(id);
  const start = (e) => { e.preventDefault(); keys[prop] = true; };
  const end = (e) => { e.preventDefault(); keys[prop] = false; };
  btn.addEventListener('touchstart', start, { passive: false });
  btn.addEventListener('touchend', end, { passive: false });
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', end);
  btn.addEventListener('mouseleave', end);
}
bindBtn('btnLeft', 'left');
bindBtn('btnRight', 'right');
bindBtn('btnJump', 'jump');

canvas.addEventListener('touchstart', (e) => {
  const rect = canvas.getBoundingClientRect();
  const tx = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
  if (tx < player.x - 20) { keys.left = true; keys.right = false; }
  else if (tx > player.x + 20) { keys.right = true; keys.left = false; }
}, { passive: true });
canvas.addEventListener('touchend', () => { keys.left = false; keys.right = false; }, { passive: true });

// ==================== 主渲染迴圈 ====================
function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 地面與球網
  ctx.fillStyle = '#6ab04c'; ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
  ctx.fillStyle = '#badc58'; ctx.fillRect(0, GROUND_Y, canvas.width, 10);
  ctx.fillStyle = '#dcdde1'; ctx.fillRect(520, 240, 12, GROUND_Y - 240);
  ctx.fillStyle = '#eb4d4b'; ctx.fillRect(514, 235, 24, 10);

  // 實體更新與繪製
  player.update();
  player.draw();
  enemy.draw();

  for (let b of balls) {
    b.update();
    b.draw();
  }
  checkHit();

  // ★ 繪製 3 秒算式複習卡
  if (reviewPause.active) {
    reviewPause.remainingFrames--;

    ctx.save();
    // 半透明背景聚焦卡片
    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 中央白色教學卡
    const boxW = 540, boxH = 150;
    const boxX = (canvas.width - boxW) / 2;
    const boxY = (canvas.height - boxH) / 2 - 20;

    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#f39c12';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.roundRect(boxX, boxY, boxW, boxH, 20);
    ctx.fill();
    ctx.stroke();

    // 標題小字
    ctx.fillStyle = '#d35400';
    ctx.font = 'bold 20px "Microsoft JhengHei", Arial';
    ctx.textAlign = 'center';
    ctx.fillText("💡 記起來喔！完整算式與解答", canvas.width / 2, boxY + 40);

    // 乘法大字解答
    ctx.fillStyle = '#c0392b';
    ctx.font = '900 46px Arial, "Microsoft JhengHei"';
    ctx.fillText(reviewPause.textFormula, canvas.width / 2, boxY + 95);

    // 倒數小秒數提示
    const secLeft = Math.ceil(reviewPause.remainingFrames / 60);
    ctx.fillStyle = '#7f8c8d';
    ctx.font = 'bold 14px Arial';
    ctx.fillText(`即將發下一球... (${secLeft}s)`, canvas.width / 2, boxY + 130);

    ctx.restore();

    // 3 秒倒數完畢，解除暫停並發出下一題
    if (reviewPause.remainingFrames <= 0) {
      reviewPause.active = false;
      newRound();
    }
  }

  // 即時回饋文字
  if (feedback.timer > 0 && !reviewPause.active) {
    feedback.timer--;
    ctx.save();
    ctx.font = 'bold 26px "Microsoft JhengHei", Arial';
    ctx.fillStyle = feedback.color;
    ctx.textAlign = 'center';
    ctx.fillText(feedback.text, canvas.width / 2, 75);
    ctx.restore();
  }

  requestAnimationFrame(loop);
}

// 啟動主渲染，等待選單點擊開始
loop();
</script>
